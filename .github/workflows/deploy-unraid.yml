name: Deploy Maria to Unraid

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maria-unraid
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MarStermann/maria' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, unraid, maria]
    timeout-minutes: 40
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://www.alscher-scheunemann.de' }}
      VITE_ALLOW_INDEXING: 'false'
      MARIA_PUBLIC_URL: ${{ vars.MARIA_PUBLIC_URL || 'http://192.168.178.101:8097' }}
      NODE_OPTIONS: --max-old-space-size=2560
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dedicated runner
        run: |
          test "$RUNNER_NAME" = unraid-maria
          test ! -S /var/run/docker.sock
          test "$(cat /runner-limits/memory.max)" = 4294967296
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build website and protected CMS
        run: |
          npm run build
          npm run build:cms
          printf '%s\n' "$GITHUB_SHA" > apps/web/dist/client/deploy-version.txt
          test -f apps/web/dist/cms/admin/index.html
          test ! -d apps/web/dist/client/admin
      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/maria-release.tgz" apps/web/dist/client apps/web/dist/cms/admin deploy/Dockerfile.web deploy/nginx.conf deploy/cms/server.mjs deploy/cms/Dockerfile compose.unraid.yml
      - name: Deploy and verify on Unraid
        env:
          UNRAID_SSH_KEY: ${{ secrets.MARIA_UNRAID_SSH_KEY }}
          UNRAID_KNOWN_HOSTS: ${{ secrets.MARIA_UNRAID_KNOWN_HOSTS }}
          UNRAID_HOST: ${{ vars.MARIA_UNRAID_HOST || '192.168.178.101' }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/maria-deploy-key"
          hosts="$RUNNER_TEMP/maria-known-hosts"
          trap 'rm -f "$key" "$hosts" "$RUNNER_TEMP/maria-release.tgz"' EXIT
          printf '%s\n' "$UNRAID_SSH_KEY" > "$key"
          printf '%s\n' "$UNRAID_KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 "root@$UNRAID_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/maria-release.tgz"
          printf 'Website: http://192.168.178.101:8097\nRedaktion: http://192.168.178.101:8097/admin/\nCommit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
